<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    var apiURL = 'https://script.google.com/macros/s/AKfycbwJ9ZqjhmOUEMt0jOTf2ZOr2tes-jngh5GArRor4ZmAU4uOQL_uZSA2REv6Hj2TrQ92lg/exec';
    var googleAnalyticsID = 'G-8D074M3G8Q';
    var modalTitle = 'IrrationalJT.com';
    var windowTitle = 'IrrationalJT.com';

    // Set the document title to the value of windowTitle
    document.title = windowTitle;
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap');
    :root {
      --primary-blue: #1C4587;
      --dark-blue: #02133E;
      --off-white: #F9F9F9;
      --light-gray: #B7B7B7;
      --muted-blue: #182A69;
      --near-black: #1C1C1C;
      --ink: #071224;
      --hero-top: #030917;
      --hero-bottom: #081225;
      --panel: rgba(11, 25, 51, 0.78);
      --panel-border: rgba(115, 154, 255, 0.22);
      --cyan: #67E8F9;
      --blue-glow: rgba(77, 141, 255, 0.28);
      --heading-font: 'EB Garamond', Georgia, serif;
      --body-font: Arial, 'Helvetica Neue', Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: var(--body-font);
      color: var(--off-white);
      background:
        radial-gradient(circle at 80% 15%, rgba(103, 232, 249, 0.10), transparent 18%),
        radial-gradient(circle at 70% 35%, var(--blue-glow), transparent 28%),
        linear-gradient(180deg, var(--hero-top) 0%, var(--ink) 48%, var(--hero-bottom) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(180deg, rgba(255, 255, 255, 0.55), transparent 85%);
      pointer-events: none;
    }

    #api-response {
      position: relative;
      min-height: 100vh;
    }

    /* Modal styles */
    .modal {
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 24px;
      background-color: rgba(2, 8, 22, 0.78);
      z-index: 1000;
    }

    .modal-content {
      background: rgba(11, 25, 51, 0.92);
      color: var(--off-white);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(103, 232, 249, 0.06);
      width: min(540px, 100%);
      overflow: hidden;
    }

    .modal-body {
      padding: 22px 22px 26px;
      font-size: 16px;
      line-height: 1.5;
    }

    .modal-header {
      font-family: var(--heading-font);
      font-size: 29px;
      font-weight: 700;
      margin: 0;
      color: var(--off-white);
      background: linear-gradient(135deg, var(--primary-blue), var(--muted-blue));
      padding: 16px 22px;
    }

    .modal p {
      margin: 10px 0;
    }

    .modal button {
      margin-top: 6px;
      padding: 11px 22px;
      background: linear-gradient(135deg, var(--primary-blue), var(--muted-blue));
      color: var(--off-white);
      border: 1px solid rgba(2, 19, 62, 0.55);
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .modal button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .countdown {
      font-size: 18px;
      font-style: italic;
      padding-top: 6px;
      color: rgba(103, 232, 249, 0.82);
      margin-top: 10px;
    }

    .loading-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .loading-card {
      width: min(520px, 100%);
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(103, 232, 249, 0.06);
      padding: 30px 24px;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .loading-title {
      margin: 8px 0 0;
      font-size: 14px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(249, 249, 249, 0.68);
      font-family: var(--body-font);
      font-weight: 700;
    }

    .loading-text {
      margin: 0;
      font-size: 18px;
      color: rgba(249, 249, 249, 0.84);
      font-family: var(--heading-font);
      line-height: 1.35;
    }

    .spinner-system {
      width: 170px;
      height: 170px;
      margin: 0 auto 18px;
      position: relative;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 0 18px rgba(77, 141, 255, 0.36));
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    .ring-outer {
      inset: 0;
      border-top-color: var(--cyan);
      border-right-color: rgba(103, 232, 249, 0.22);
      animation: spin 1.7s linear infinite;
    }

    .ring-inner {
      inset: 24px;
      border-bottom-color: var(--primary-blue);
      border-left-color: rgba(77, 141, 255, 0.48);
      animation: spin-reverse 1.05s linear infinite;
    }

    .orbit {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      animation: spin 2.8s linear infinite;
    }

    .orbit-b {
      inset: 6px;
      animation: spin-reverse 2.2s linear infinite;
    }

    .node {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 6px 2px;
      border-radius: 999px;
      border: 1px solid rgba(103, 232, 249, 0.28);
      background: rgba(7, 18, 36, 0.92);
      color: var(--off-white);
      font-size: 10px;
      font-family: 'Courier New', Consolas, monospace;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 0 8px rgba(2, 19, 62, 0.5);
      white-space: nowrap;
    }

    .core-chip {
      width: 124px;
      height: 124px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1px solid rgba(249, 249, 249, 0.35);
      background: linear-gradient(145deg, #071224 0%, #02133E 100%);
      padding: 10px;
      box-shadow: inset 0 0 0 1px rgba(103, 232, 249, 0.12), 0 10px 22px rgba(0, 0, 0, 0.42), 0 0 22px rgba(77, 141, 255, 0.22);
      overflow: hidden;
      animation: pulse 1.3s ease-in-out infinite alternate;
    }

    .core-chip img {
      width: auto;
      height: 100px;
      min-height: 100px;
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spin-reverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes pulse {
      from {
        transform: scale(0.96);
      }

      to {
        transform: scale(1.04);
      }
    }

    @media (max-width: 479px) {
      .modal {
        padding: 16px;
      }

      .modal-header {
        font-size: 25px;
      }

      .modal-body {
        font-size: 15px;
      }

      .loading-card {
        padding: 24px 18px;
      }

      .loading-text {
        font-size: 16px;
      }
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script>
    const script = document.createElement('script');
    script.async = true;
    script.src = `https://www.googletagmanager.com/gtag/js?id=${googleAnalyticsID}`;
    document.head.appendChild(script);
  </script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', googleAnalyticsID);

  </script>
  <script>
    function fetchApiData() {
      // Get the current URL's query string
      var queryString = window.location.search;

      // Append the query string to the apiURL
      apiURL += queryString;

      fetch(apiURL, {
        redirect: 'follow', // manual, *follow, error
        method: 'GET',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        }
      })
        .then(response => response.text())
        .then(data => {
          ProcessData(data);
          console.log('Received data:', data);
        })
        .catch(error => {
          console.error('Error fetching data:', error);
          document.getElementById('api-response').innerHTML = getErrorTemplate();
        });
    }

    function ProcessData(data) {
      try {
        const jsonData = JSON.parse(data);
        gtag('event', 'screen_view', {
          'app_name': 'dynamic-redirect',
          'page_code': window.location.search,
          'url': jsonData.RedirectURL
        });
        console.log('Processing JSON data:', jsonData);

        const redirectURL = jsonData.RedirectURL;
        const message = jsonData.Message || '';
        const buttonText = jsonData.ConfirmationButtonText || '';

        if (!message && !buttonText) {
          window.location.href = redirectURL;
        } else if (message && !buttonText) {
          const countdownTime = calculateReadingTime(message);
          let countdownSeconds = Math.round(countdownTime / 1000);
          const countdownInterval = setInterval(() => {
            document.getElementById('api-response').innerHTML = getCountdownTemplate(message, countdownSeconds);
            countdownSeconds--;
            if (countdownSeconds < 0) {
              clearInterval(countdownInterval);
              window.location.href = redirectURL;
            }
          }, 1000);
        } else if (message && buttonText) {
          document.getElementById('api-response').innerHTML = getButtonTemplate(message, buttonText);
          document.getElementById('confirmation-button').addEventListener('click', () => {
            window.location.href = redirectURL;
          });
        }
      } catch (error) {
        console.error('Error processing JSON data:', error);
        document.getElementById('api-response').innerHTML = getErrorTemplate();
      }
    }

    function calculateReadingTime(text) {
      const wordsPerMinute = 200; // Average reading speed
      const words = text.trim().split(/\s+/).length; // Count words in the text
      const readingTimeMinutes = words / wordsPerMinute; // Time in minutes
      const readingTimeMilliseconds = readingTimeMinutes * 60 * 1000; // Convert to milliseconds
      return Math.round(readingTimeMilliseconds) + 1000; // Round to the nearest millisecond
    }

    function getCountdownTemplate(message, countdownSeconds) {
      return `
        <div class="modal">
          <div class="modal-content">
            <h1 class="modal-header">${modalTitle}</h1>
            <div class="modal-body">
              <p>${message}</p>
              <p class="countdown">Redirecting in ${countdownSeconds} seconds...</p>
            </div>
          </div>
        </div>
      `;
    }

    function getButtonTemplate(message, buttonText) {
      return `
        <div class="modal">
          <div class="modal-content">
            <h1 class="modal-header">${modalTitle}</h1>
            <div class="modal-body">
              <p>${message}</p>
              <button id="confirmation-button">${buttonText}</button>
            </div>
          </div>
        </div>
      `;
    }

    function getErrorTemplate() {
      return `
        <div class="modal">
          <div class="modal-content">
            <h1 class="modal-header">${modalTitle}</h1>
            <div class="modal-body">
              <p>We hit an error while preparing your redirect.</p>
              <p class="countdown">Please refresh and try again.</p>
            </div>
          </div>
        </div>
      `;
    }

    window.onload = fetchApiData;
  </script>
</head>

<body>
  <div id="api-response">
    <div class="loading-wrap">
      <div class="loading-card">
        <div class="spinner-system" aria-hidden="true">
          <div class="ring ring-outer"></div>
          <div class="ring ring-inner"></div>
          <div class="orbit orbit-a"><span class="node">{ }</span></div>
          <div class="orbit orbit-b"><span class="node">&lt;/&gt;</span></div>
          <div class="core-chip"><img src="jt.png" alt=""></div>
        </div>
        <p class="loading-text">Establishing a secure connection. One moment while we verify everything...</p>
        <h1 class="loading-title">IrrationalJT.com</h1>
      </div>
    </div>
  </div>
</body>

</html>
