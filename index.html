<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    var apiURL = 'https://script.google.com/macros/s/AKfycbwJ9ZqjhmOUEMt0jOTf2ZOr2tes-jngh5GArRor4ZmAU4uOQL_uZSA2REv6Hj2TrQ92lg/exec';
    var googleAnalyticsID = 'G-8D074M3G8Q';
    var modalTitle = 'IrrationalJT.com';
    var windowTitle = 'IrrationalJT.com';

    // Set the document title to the value of windowTitle
    document.title = windowTitle;
  </script>

  <style>
    :root {
      --primary-blue: #1C4587;
      --dark-blue: #02133E;
      --off-white: #F9F9F9;
      --light-gray: #B7B7B7;
      --muted-blue: #182A69;
      --near-black: #1C1C1C;
      --heading-font: 'EB Garamond', Georgia, serif;
      --body-font: Arial, 'Helvetica Neue', Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: var(--body-font);
      color: var(--off-white);
      background: radial-gradient(circle at 20% 20%, #264f96 0%, var(--dark-blue) 45%, var(--muted-blue) 100%);
    }

    #api-response {
      min-height: 100vh;
    }

    /* Modal styles */
    .modal {
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 24px;
      background-color: rgba(2, 19, 62, 0.72);
      z-index: 1000;
    }

    .modal-content {
      background: linear-gradient(170deg, rgba(249, 249, 249, 0.97) 0%, rgba(234, 241, 252, 0.96) 100%);
      color: var(--near-black);
      border: 1px solid rgba(28, 69, 135, 0.2);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(2, 19, 62, 0.35);
      width: min(540px, 100%);
      overflow: hidden;
    }

    .modal-body {
      padding: 22px 22px 26px;
      font-size: 16px;
      line-height: 1.5;
    }

    .modal-header {
      font-family: var(--heading-font);
      font-size: 29px;
      font-weight: 700;
      margin: 0;
      color: var(--off-white);
      background: linear-gradient(135deg, var(--primary-blue), var(--muted-blue));
      padding: 16px 22px;
    }

    .modal p {
      margin: 10px 0;
    }

    .modal button {
      margin-top: 6px;
      padding: 11px 22px;
      background: linear-gradient(135deg, var(--primary-blue), var(--muted-blue));
      color: var(--off-white);
      border: 1px solid rgba(2, 19, 62, 0.55);
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .modal button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .countdown {
      font-size: 18px;
      font-style: italic;
      padding-top: 6px;
      color: #2f4778;
      margin-top: 10px;
    }

    .loading-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .loading-card {
      width: min(520px, 100%);
      border-radius: 18px;
      background: rgba(2, 19, 62, 0.65);
      border: 1px solid rgba(249, 249, 249, 0.16);
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.28);
      padding: 30px 24px;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .loading-title {
      margin: 0 0 10px;
      font-family: var(--heading-font);
      font-size: clamp(30px, 5vw, 36px);
      line-height: 1.2;
    }

    .loading-text {
      margin: 0;
      font-size: 16px;
      color: var(--light-gray);
    }

    .spinner {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      position: relative;
      filter: drop-shadow(0 0 10px rgba(249, 249, 249, 0.25));
      animation: spin 1.1s linear infinite;
    }

    .spinner::before,
    .spinner::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid transparent;
    }

    .spinner::before {
      border-top-color: var(--off-white);
      border-right-color: rgba(249, 249, 249, 0.35);
    }

    .spinner::after {
      inset: 10px;
      border-top-color: var(--primary-blue);
      border-right-color: rgba(28, 69, 135, 0.3);
      animation: spin-reverse 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spin-reverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @media (max-width: 479px) {
      .modal {
        padding: 16px;
      }

      .modal-header {
        font-size: 25px;
      }

      .modal-body {
        font-size: 15px;
      }

      .loading-card {
        padding: 24px 18px;
      }
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script>
    const script = document.createElement('script');
    script.async = true;
    script.src = `https://www.googletagmanager.com/gtag/js?id=${googleAnalyticsID}`;
    document.head.appendChild(script);
  </script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', googleAnalyticsID);

  </script>
  <script>
    function fetchApiData() {
      // Get the current URL's query string
      var queryString = window.location.search;

      // Append the query string to the apiURL
      apiURL += queryString;

      fetch(apiURL, {
        redirect: 'follow', // manual, *follow, error
        method: 'GET',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        }
      })
        .then(response => response.text())
        .then(data => {
          ProcessData(data);
          console.log('Received data:', data);
        })
        .catch(error => {
          console.error('Error fetching data:', error);
          document.getElementById('api-response').innerHTML = getErrorTemplate();
        });
    }

    function ProcessData(data) {
      try {
        const jsonData = JSON.parse(data);
        gtag('event', 'screen_view', {
          'app_name': 'dynamic-redirect',
          'page_code': window.location.search,
          'url': jsonData.RedirectURL
        });
        console.log('Processing JSON data:', jsonData);

        const redirectURL = jsonData.RedirectURL;
        const message = jsonData.Message || '';
        const buttonText = jsonData.ConfirmationButtonText || '';

        if (!message && !buttonText) {
          window.location.href = redirectURL;
        } else if (message && !buttonText) {
          const countdownTime = calculateReadingTime(message);
          let countdownSeconds = Math.round(countdownTime / 1000);
          const countdownInterval = setInterval(() => {
            document.getElementById('api-response').innerHTML = getCountdownTemplate(message, countdownSeconds);
            countdownSeconds--;
            if (countdownSeconds < 0) {
              clearInterval(countdownInterval);
              window.location.href = redirectURL;
            }
          }, 1000);
        } else if (message && buttonText) {
          document.getElementById('api-response').innerHTML = getButtonTemplate(message, buttonText);
          document.getElementById('confirmation-button').addEventListener('click', () => {
            window.location.href = redirectURL;
          });
        }
      } catch (error) {
        console.error('Error processing JSON data:', error);
        document.getElementById('api-response').innerHTML = getErrorTemplate();
      }
    }

    function calculateReadingTime(text) {
      const wordsPerMinute = 200; // Average reading speed
      const words = text.trim().split(/\s+/).length; // Count words in the text
      const readingTimeMinutes = words / wordsPerMinute; // Time in minutes
      const readingTimeMilliseconds = readingTimeMinutes * 60 * 1000; // Convert to milliseconds
      return Math.round(readingTimeMilliseconds) + 1000; // Round to the nearest millisecond
    }

    function getCountdownTemplate(message, countdownSeconds) {
      return `
        <div class="modal">
          <div class="modal-content">
            <h1 class="modal-header">${modalTitle}</h1>
            <div class="modal-body">
              <p>${message}</p>
              <p class="countdown">Redirecting in ${countdownSeconds} seconds...</p>
            </div>
          </div>
        </div>
      `;
    }

    function getButtonTemplate(message, buttonText) {
      return `
        <div class="modal">
          <div class="modal-content">
            <h1 class="modal-header">${modalTitle}</h1>
            <div class="modal-body">
              <p>${message}</p>
              <button id="confirmation-button">${buttonText}</button>
            </div>
          </div>
        </div>
      `;
    }

    function getErrorTemplate() {
      return `
        <div class="modal">
          <div class="modal-content">
            <h1 class="modal-header">${modalTitle}</h1>
            <div class="modal-body">
              <p>We hit an error while preparing your redirect.</p>
              <p class="countdown">Please refresh and try again.</p>
            </div>
          </div>
        </div>
      `;
    }

    window.onload = fetchApiData;
  </script>
</head>

<body>
  <div id="api-response">
    <div class="loading-wrap">
      <div class="loading-card">
        <div class="spinner" aria-hidden="true"></div>
        <h1 class="loading-title">IrrationalJT.com</h1>
        <p class="loading-text">Compiling your redirect and a little chaos...</p>
      </div>
    </div>
  </div>
</body>

</html>
